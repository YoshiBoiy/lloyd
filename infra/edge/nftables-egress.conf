#!/usr/sbin/nft -f
# Host-boundary egress policy for the RDK X5 gateway (TDD §9).
#
# Only the gateway service account may open outbound connections, and only to the configured backend
# transport. ML runtimes, subprocesses and anything else running as lloyd-edge cannot reach external
# endpoints; nothing running as other users can impersonate the release path. Pair with the in-unit
# IPAddressAllow list in lloyd-edge-gateway.service — both must agree.
#
# Substitute the placeholders before loading:
#   BACKEND_IP      IPv4 address of the Lloyd API host (the target of EDGE_BACKEND_URL / EDGE_BACKEND_V2_URL)
#   BACKEND_PORT    TCP port of the Lloyd API (3001 by default, 443 behind TLS termination)
#   LAN_CIDR        the operator network allowed to pair with the gateway (e.g. 192.168.10.0/24)
#   GATEWAY_PORT    EDGE_BIND_PORT (8001 by default)
#
# Load:   sudo nft -f nftables-egress.conf
# Persist: append `include "/etc/nftables.d/lloyd-edge.conf"` to /etc/nftables.conf and enable nftables.

define backend_ip   = BACKEND_IP
define backend_port = BACKEND_PORT
define lan_cidr     = LAN_CIDR
define gateway_port = GATEWAY_PORT
define gateway_user = "lloyd-edge"

table inet lloyd_edge {
    chain output {
        type filter hook output priority 0; policy drop;

        ct state established,related accept
        oif "lo" accept

        # Time sync and DNS are host services, not gateway egress; keep them for the system only.
        meta skuid != $gateway_user udp dport { 53, 123 } accept
        meta skuid != $gateway_user tcp dport 53 accept

        # The only permitted gateway egress: the approved release path to the backend.
        meta skuid $gateway_user ip daddr $backend_ip tcp dport $backend_port ct state new accept

        # Everything else from the gateway account is logged (bounded metadata only) and dropped.
        meta skuid $gateway_user log prefix "lloyd-edge egress denied " level warn limit rate 6/minute drop

        # Non-gateway system traffic: allow package updates only through the admin's explicit rules.
        meta skuid != $gateway_user tcp dport { 22, 80, 443 } accept
        drop
    }

    chain input {
        type filter hook input priority 0; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif "lo" accept
        icmp type echo-request limit rate 5/second accept
        icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

        # Pairing: only the operator LAN may reach the gateway port; direct browser pairing uses this path.
        ip saddr $lan_cidr tcp dport $gateway_port ct state new accept

        # Administration.
        ip saddr $lan_cidr tcp dport 22 ct state new accept

        log prefix "lloyd-edge ingress denied " level warn limit rate 6/minute drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }
}
